name: CI
# ONE FULL RUN PER PR (kattakath/.github's shared landing system). `gate` is the only
# required check: it asserts each needed job ended exactly as the event expects. `checks`
# runs once, in the merge queue when vars.QUEUE_ENABLED is 'true', otherwise on the PR; fork
# PRs always get it on the PR. No `push: main` leg: the queue tests the very commit main gets.
on:
  pull_request:
  # REQUIRED by the merge queue: a queue entry is built on its own
  # `gh-readonly-queue/main/...` ref, which emits NEITHER `pull_request` NOR
  # `push`. Without this trigger the required context never reports on a
  # queued entry and every merge times out.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale PR runs; never cancel a queue run (the queue would eject the PR).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # THE ONLY REQUIRED CHECK. Every ruleset names it; never rename it.
  gate:
    if: ${{ !cancelled() }}
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # `expect` is a deliberate SECOND copy of `checks`' `if:`; if they drift, gate goes red.
      - uses: kattakath/.github/actions/gate@3d5ad5b9e04c853dbb0d82446255c9ef9230332a
        with:
          needs: ${{ toJSON(needs) }}
          expect: >-
            {"checks": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }}}

  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Flake outputs well-formed
        run: nix flake show
      # `nix flake check` BUILDS the checks, and the flake now declares three that
      # each subsume one of the ambient steps this job used to run:
      #
      #   formatting          treefmt (nixfmt + statix + deadnix) over the tree,
      #                       replacing `nix run nixpkgs#nixfmt-rfc-style --check`
      #   project-gate        node --check over every file PLUS import resolution,
      #                       replacing `nix run nixpkgs#nodejs -- --check`
      #   toolchain-complete  asserts the devShell delivers what it promises,
      #                       which nothing here checked at all
      #
      # The removed steps were not merely duplicates, they were STRICTLY WEAKER:
      # each `nix run nixpkgs#...` resolved an UNPINNED registry entry, so CI could
      # format or parse with a different tool version than `nix develop` does, and
      # neither ran statix, deadnix or the import scan. The checks run from this
      # flake's own pin.
      - name: Module eval + package build
        run: nix flake check -L
