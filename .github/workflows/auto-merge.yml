name: auto-merge

# Thin caller. The logic, and why it needs an App token rather than GITHUB_TOKEN, lives in
# kattakath/.github/.github/workflows/auto-merge.yml. With the merge queue on, arming means
# "queue once `gate` is green", so open work in progress as a DRAFT.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  # false: `true` let a later event cancel the ready_for_review arm run (kattakath/nix-config #750).
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  arm:
    uses: kattakath/.github/.github/workflows/auto-merge.yml@3d5ad5b9e04c853dbb0d82446255c9ef9230332a
    with:
      client-id: ${{ vars.CI_BOT_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
